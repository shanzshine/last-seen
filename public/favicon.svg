<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="#09090b" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#27272a" stroke-width="1.5" />
  <!-- Smartphone body -->
  <rect x="19" y="10" width="26" height="44" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
  <!-- Screen -->
  <rect x="22" y="15" width="20" height="33" rx="2.5" fill="url(#screenGrad)" />
  <!-- Signal Eye / Radar -->
  <circle cx="32" cy="31.5" r="5.5" stroke="#34d399" stroke-width="1.8" />
  <circle cx="32" cy="31.5" r="2" fill="#34d399" />
  <!-- Live Red Last Seen Dot -->
  <circle cx="47" cy="14" r="5" fill="#f43f5e" stroke="#09090b" stroke-width="2" />
  <defs>
    <linearGradient id="screenGrad" x1="32" y1="15" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#064e3b" />
      <stop offset="1" stop-color="#09090b" />
    </linearGradient>
  </defs>
</svg>
